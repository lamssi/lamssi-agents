name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  # Keep LiteLLM's model metadata local and deterministic in an offline test run.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  # Unit tests, correctness lint, and import contracts on supported desktop OSes.
  checks:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        if: runner.os != 'Linux'
        run: uv sync --locked --group dev
      - name: Install dependencies and Qt example (Linux)
        if: runner.os == 'Linux'
        run: uv sync --locked --group dev --extra qt

      # Desktop examples need a display for their thread-affinity checks.
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} uv run pytest -q -m "not slow"

      - name: Python correctness lint
        run: uv run ruff check --select F,E9,B src tests examples

      - name: Import contracts
        run: uv run lint-imports

  # Build and test the installed wheel without the source tree on sys.path.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - name: Wheel-only acceptance
        run: uv run pytest -q -m slow tests/test_wheel_only.py
